AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Aurelia Air flight chat - an AWS AppSync Events API (serverless WebSocket pub/sub).
  Deliberately contains NO IAM resources, so it deploys on accounts that cannot create roles.
  The API key is created by aws/chat-deploy.sh (aws appsync create-api-key), not by this template.

Parameters:
  ApiName:
    Type: String
    Default: aurelia-chat
    Description: Name of the Event API.

Resources:
  ChatApi:
    Type: AWS::AppSync::Api
    Properties:
      Name: !Ref ApiName
      EventConfig:
        AuthProviders:
          - AuthType: API_KEY
        ConnectionAuthModes:
          - AuthType: API_KEY
        DefaultPublishAuthModes:
          - AuthType: API_KEY
        DefaultSubscribeAuthModes:
          - AuthType: API_KEY

  # Channels look like /flights/CX521-20261201 (namespace "flights" + one segment per flight and day).
  # The name must match NAMESPACE in chat.js.
  FlightsNamespace:
    Type: AWS::AppSync::ChannelNamespace
    Properties:
      ApiId: !GetAtt ChatApi.ApiId
      Name: flights

Outputs:
  ApiId:
    Value: !GetAtt ChatApi.ApiId
  HttpDns:
    Description: HTTP endpoint host (also used as the "host" field of the API-key authorization)
    Value: !GetAtt ChatApi.Dns.Http
  RealtimeDns:
    Description: WebSocket endpoint host
    Value: !GetAtt ChatApi.Dns.Realtime
