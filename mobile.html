<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cathay Student — Mobile preview</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e4e6e0;font-family:system-ui,sans-serif}
    .wrap{display:grid;gap:14px;justify-items:center;padding:24px}
    .phone{width:390px;height:800px;border-radius:44px;border:10px solid #fff;background:#f3f4ef;overflow:hidden;box-shadow:0 30px 80px rgba(6,48,31,.25);display:flex;flex-direction:column}
    .status{flex:none;height:40px;display:flex;justify-content:space-between;align-items:center;padding:0 26px;font-size:13px;font-weight:600;color:#10261c;background:#f3f4ef}
    .status i{display:inline-flex;gap:5px;align-items:center}.status i b{width:5px;height:12px;border-radius:2px;background:#10261c}.status i u{width:14px;height:5px;border-radius:2px;background:#10261c}
    iframe{flex:1;width:100%;border:0;background:#f3f4ef}
    p{margin:0;color:#555;font-size:13px}
    a{color:#0b4a35}
    @media (max-width:520px){.phone{width:100vw;height:100vh;border:0;border-radius:0}.status{display:none}.wrap{padding:0}p{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="phone"><div class="status"><span>9:41</span><i><b></b><b></b><u></u></i></div><iframe src="index.html#/home" title="Cathay Student mobile preview"></iframe></div>
    <p>Phone-frame preview of the same app · <a href="index.html">open full desktop view</a></p>
  </div>
</body>
</html>
