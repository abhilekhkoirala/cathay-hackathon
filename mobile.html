<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Aurelia Air — Mobile preview</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9ebf5;font-family:system-ui,sans-serif}
    .wrap{display:grid;gap:14px;justify-items:center;padding:24px}
    .phone{width:390px;height:800px;border-radius:44px;border:12px solid #14183a;background:#000;overflow:hidden;box-shadow:0 30px 80px rgba(20,24,58,.35);position:relative}
    .phone::before{content:"";position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:22px;background:#14183a;border-radius:0 0 16px 16px;z-index:2}
    iframe{width:100%;height:100%;border:0;background:#fff}
    p{margin:0;color:#555;font-size:13px}
    a{color:#3a4aa8}
    @media (max-width:520px){.phone{width:100vw;height:100vh;border:0;border-radius:0}.wrap{padding:0}p{display:none}}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="phone"><iframe src="index.html#/home" title="Aurelia Air mobile app preview"></iframe></div>
    <p>Phone-frame preview of the same app · <a href="index.html">open full desktop view</a></p>
  </div>
</body>
</html>
